<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青玉案·元夕 - 劇本查看器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.6;
        }
        
        .scene-card {
            background: rgba(30, 30, 30, 0.9);
            border-left: 4px solid #ffb300;
            transition: all 0.3s ease;
            margin-bottom: 2px;
        }
        
        .scene-card:hover {
            background: rgba(40, 30, 20, 0.95);
            transform: translateX(5px);
        }
        
        .dialogue-line {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }
        
        .dialogue-line:hover {
            background: rgba(255, 179, 0, 0.05);
        }
        
        .character-narrator { color: #888; font-style: italic; }
        .character-xin { color: #ffca28; font-weight: 600; }
        .character-me { color: #a8dadc; }
        .character-ye { color: #ff6b6b; }
        .character-lady { color: #e1bee7; }
        .character-teacher { color: #e0e0e0; }
        .character-uxin { color: #ffca28; opacity: 0.8; }
        
        .scene-header {
            background: rgba(20, 20, 20, 0.95);
            border-bottom: 2px solid #ffb300;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .jump-link {
            color: #4fc3f7;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .jump-link:hover {
            color: #29b6f6;
            text-decoration: underline;
        }
        
        .scene-id-badge {
            background: #ffb300;
            color: #000;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.9rem;
        }
        
        .next-scene {
            background: rgba(76, 175, 80, 0.2);
            color: #8bc34a;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            display: inline-block;
            margin-left: 10px;
        }
        
        .choice-option {
            background: rgba(96, 125, 139, 0.2);
            border-left: 3px solid #607d8b;
            margin: 5px 0 5px 20px;
            padding: 8px 12px;
        }
        
        .game-scene {
            background: rgba(103, 58, 183, 0.1);
            border-left: 4px solid #673ab7;
        }
        
        .ending-scene {
            background: rgba(233, 30, 99, 0.1);
            border-left: 4px solid #e91e63;
        }

        mark {
            background-color: rgba(217, 119, 6, 0.4);
            color: #fde68a;
            border-radius: 2px;
            padding: 0 2px;
        }
    </style>
</head>
<body class="p-4">
    <div class="max-w-6xl mx-auto">
        <div class="text-center mb-8 p-6 bg-gradient-to-r from-gray-900 to-black rounded-xl shadow-xl">
            <h1 class="text-4xl font-bold text-amber-300 mb-2">青玉案·元夕 - 劇本查看器</h1>
            <h2 class="text-xl text-gray-400 mb-4">眾裡尋他千百度，驀然迴首，那人卻在，燈火闌珊處</h2>
        </div>        
        <div id="scenes-container">
            <div class="text-center py-10 text-gray-500" id="loading-message">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-amber-500 mb-4"></div>
                <p>Appologies for the Temporary Downbreak</p>
                <p>臨時下架 如有不便 敬請原諒</p>
            </div>
        </div>
    </div>
</body>
</html>
