<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青玉案·元夕 - 劇本查看器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.6;
        }
        
        .scene-card {
            background: rgba(30, 30, 30, 0.9);
            border-left: 4px solid #ffb300;
            transition: all 0.3s ease;
            margin-bottom: 2px;
        }
        
        .scene-card:hover {
            background: rgba(40, 30, 20, 0.95);
            transform: translateX(5px);
        }
        
        .dialogue-line {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }
        
        .dialogue-line:hover {
            background: rgba(255, 179, 0, 0.05);
        }
        
        .character-narrator { color: #888; font-style: italic; }
        .character-xin { color: #ffca28; font-weight: 600; }
        .character-me { color: #a8dadc; }
        .character-ye { color: #ff6b6b; }
        .character-lady { color: #e1bee7; }
        .character-teacher { color: #e0e0e0; }
        .character-uxin { color: #ffca28; opacity: 0.8; }
        
        .scene-header {
            background: rgba(20, 20, 20, 0.95);
            border-bottom: 2px solid #ffb300;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .jump-link {
            color: #4fc3f7;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .jump-link:hover {
            color: #29b6f6;
            text-decoration: underline;
        }
        
        .scene-id-badge {
            background: #ffb300;
            color: #000;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.9rem;
        }
        
        .next-scene {
            background: rgba(76, 175, 80, 0.2);
            color: #8bc34a;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            display: inline-block;
            margin-left: 10px;
        }
        
        .choice-option {
            background: rgba(96, 125, 139, 0.2);
            border-left: 3px solid #607d8b;
            margin: 5px 0 5px 20px;
            padding: 8px 12px;
        }
        
        .game-scene {
            background: rgba(103, 58, 183, 0.1);
            border-left: 4px solid #673ab7;
        }
        
        .ending-scene {
            background: rgba(233, 30, 99, 0.1);
            border-left: 4px solid #e91e63;
        }

        mark {
            background-color: rgba(217, 119, 6, 0.4);
            color: #fde68a;
            border-radius: 2px;
            padding: 0 2px;
        }
    </style>
</head>
<body class="p-4">
    <div class="max-w-6xl mx-auto">
        <div class="text-center mb-8 p-6 bg-gradient-to-r from-gray-900 to-black rounded-xl shadow-xl">
            <h1 class="text-4xl font-bold text-amber-300 mb-2">青玉案·元夕 - 劇本查看器</h1>
            <h2 class="text-xl text-gray-400 mb-4">眾裡尋他千百度，驀然迴首，那人卻在，燈火闌珊處</h2>
            <div class="flex flex-wrap justify-center gap-4 text-sm">
                <div class="bg-gray-800 px-4 py-2 rounded-lg">
                    <span class="text-gray-400">場景總數：</span>
                    <span id="total-scenes" class="text-amber-300 font-bold">0</span>
                </div>
                <div class="bg-gray-800 px-4 py-2 rounded-lg">
                    <span class="text-gray-400">對話總行數：</span>
                    <span id="total-lines" class="text-amber-300 font-bold">0</span>
                </div>
                <div class="bg-gray-800 px-4 py-2 rounded-lg">
                    <span class="text-gray-400">最後更新：</span>
                    <span id="last-update" class="text-amber-300 font-bold">正在載入...</span>
                </div>
            </div>
            <p class="text-gray-500 text-sm mt-4">
                此頁面自動從 index.html 提取劇情資料。
            </p>
        </div>
        
        <div class="scene-header p-4 rounded-lg mb-6 shadow-lg">
            <div class="flex flex-wrap justify-between items-center gap-4">
                <h3 class="text-xl font-bold text-amber-200">場景導航</h3>
                <div class="flex gap-2 flex-grow justify-end">
                    <input type="text" id="search-scenes" placeholder="搜尋場景或對話..." 
                           class="bg-gray-800 text-white px-4 py-2 rounded-lg border border-gray-700 focus:outline-none focus:border-amber-500 w-full max-w-md">
                    <button id="toggle-all" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition whitespace-nowrap">
                        收合所有
                    </button>
                </div>
            </div>
            <div id="scene-navigation" class="flex flex-wrap gap-2 mt-4 max-h-32 overflow-y-auto">
                </div>
        </div>
        
        <div id="scenes-container">
            <div class="text-center py-10 text-gray-500" id="loading-message">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-amber-500 mb-4"></div>
                <p>正在從 index.html 載入劇情資料...</p>
            </div>
        </div>
        
        <div class="text-center mt-8 pt-6 border-t border-gray-800">
            <a href="index.html" class="inline-block bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 shadow-lg">
                返回遊戲 (index.html)
            </a>
            <p class="text-gray-500 text-sm mt-4">
                Viewer v1.1 | Fixed Parsing Logic
            </p>
        </div>
    </div>
    
    <script>
        // 全局變數
        let SCENES = {};
        let CHARS = {};
        let IMAGES = {};
        let allScenesLoaded = false;
        let isExpanded = true;
        
        /**
         * 幫助函數：安全地從字串中提取JS物件
         * 使用括號計數而不是Regex，以支援嵌套物件和函數
         */
        function extractVariableObject(source, varName, context = {}) {
            // Find variable definition: "const SCENES =" or "var SCENES ="
            const regex = new RegExp(`(?:const|var|let)\\s+${varName}\\s*=\\s*`);
            const match = source.match(regex);
            
            if (!match) return null;
            
            const startIndex = match.index + match[0].length;
            const openBraceIndex = source.indexOf('{', startIndex);
            if (openBraceIndex === -1) return null;
            
            let balance = 0;
            let inString = false;
            let stringChar = '';
            let isEscaped = false;
            let foundEnd = false;
            let endIndex = -1;
            
            // Bracket counting to find the end of the object
            for (let i = openBraceIndex; i < source.length; i++) {
                const char = source[i];
                if (inString) {
                    if (isEscaped) isEscaped = false;
                    else if (char === '\\') isEscaped = true;
                    else if (char === stringChar) inString = false;
                } else {
                    if (char === '"' || char === "'" || char === '`') {
                        inString = true;
                        stringChar = char;
                    } else if (char === '{') {
                        balance++;
                    } else if (char === '}') {
                        balance--;
                        if (balance === 0) {
                            endIndex = i + 1;
                            foundEnd = true;
                            break;
                        }
                    }
                }
            }
            
            if (!foundEnd) return null;
            
            const objectString = source.substring(openBraceIndex, endIndex);
            
            // Prepare context for the function (keys as arg names, values as args)
            const ctxKeys = Object.keys(context);
            const ctxValues = Object.values(context);
            
            try {
                // Create a function that accepts the context variables as arguments
                // e.g. new Function("xin", "me", "return { ... }")(xinObj, meObj)
                const fn = new Function(...ctxKeys, "return " + objectString);
                return fn(...ctxValues);
            } catch (e) {
                console.warn(`Initial parse of ${varName} failed, retrying with raw evaluation...`, e);
                // Last resort: simple eval if context injection failed (risky but effective for simple objects)
                try {
                    return eval("(" + objectString + ")");
                } catch (e2) {
                    console.error(`Failed to parse ${varName}:`, e2);
                    return null;
                }
            }
        }

        // IMPROVED: Data Extraction Logic
        async function extractScenesData() {
            try {
                console.log("開始從 index.html 提取資料...");
                
                // Check for file protocol
                if (window.location.protocol === 'file:') {
                    console.warn("正在使用 file:// 協議，fetch 可能會被瀏覽器阻擋。");
                }

                const response = await fetch('index.html');
                if (!response.ok) {
                    throw new Error(`無法載入 index.html (Status: ${response.status})`);
                }
                
                const htmlText = await response.text();
                console.log("成功載入 index.html，開始解析...");
                
                // 1. First, try to extract CHARS if it exists
                let extractedChars = extractVariableObject(htmlText, 'CHARS') || {};
                
                // 2. Build a Context Object with known character variable names
                // This mimics the variables likely defined in your index.html
                const dependencyContext = {
                    ...extractedChars, // Include anything found in CHARS
                    // Fallback definitions for common variable names used in this script style
                    xin: { name: "辛棄疾" },
                    me: { name: "我" },
                    ye: { name: "葉知秋" },
                    lady: { name: "貴婦" },
                    teacher: { name: "老師" },
                    uxin: { name: "？？？" },
                    CHARS: extractedChars // Self-reference just in case
                };

                // 3. Extract SCENES, injecting the known variables
                SCENES = extractVariableObject(htmlText, 'SCENES', dependencyContext);
                CHARS = extractedChars;
                IMAGES = extractVariableObject(htmlText, 'IMAGES') || {};
                
                if (!SCENES || Object.keys(SCENES).length === 0) {
                    throw new Error("無法解析 SCENES 物件。請檢查 index.html 變數定義格式。");
                }

                console.log("成功解析 SCENES，共", Object.keys(SCENES).length, "個場景");
                
                allScenesLoaded = true;
                updateLastUpdateTime();
                renderAllScenes();
                
            } catch (error) {
                console.error("提取資料時發生錯誤:", error);
                let errorMsg = error.message;
                if (window.location.protocol === 'file:' && !errorMsg.includes("SCENES")) {
                    errorMsg = "瀏覽器安全策略阻止了本地檔案讀取 (CORS 錯誤)。<br>請使用 VS Code Live Server 或 Python 伺服器。";
                }
                document.getElementById('loading-message').innerHTML = 
                    `<div class="bg-red-900/30 border border-red-700 rounded-lg p-6 max-w-2xl mx-auto">
                        <h3 class="text-xl text-red-300 font-bold mb-2">載入失敗</h3>
                        <p class="text-red-400">${errorMsg}</p>
                    </div>`;
            }
        }
        
        // 更新最後更新時間
        function updateLastUpdateTime() {
            const now = new Date();
            const timeString = now.toLocaleString('zh-Hant');
            document.getElementById('last-update').textContent = timeString;
        }
        
        // 渲染所有場景
        function renderAllScenes() {
            if (!allScenesLoaded) return;
            
            const scenesContainer = document.getElementById('scenes-container');
            const sceneNavigation = document.getElementById('scene-navigation');
            const sceneIds = Object.keys(SCENES);
            
            // 更新統計資訊
            document.getElementById('total-scenes').textContent = sceneIds.length;
            
            let totalLines = 0;
            sceneIds.forEach(sceneId => {
                if (SCENES[sceneId].script) {
                    totalLines += SCENES[sceneId].script.length;
                }
            });
            document.getElementById('total-lines').textContent = totalLines;
            
            // 清空容器
            scenesContainer.innerHTML = '';
            sceneNavigation.innerHTML = '';
            
            // 渲染每個場景
            sceneIds.forEach(sceneId => {
                // 添加到導航
                const navLink = document.createElement('a');
                navLink.href = `#scene-${sceneId}`;
                navLink.className = 'bg-gray-800 hover:bg-gray-700 text-white px-3 py-1 rounded text-sm transition border border-gray-700';
                navLink.textContent = sceneId;
                sceneNavigation.appendChild(navLink);
                
                // 創建場景卡片
                const sceneCard = document.createElement('div');
                sceneCard.id = `scene-${sceneId}`;
                sceneCard.className = 'scene-card rounded-lg mb-6 overflow-hidden shadow-lg';
                
                // 根據場景類型添加特殊樣式
                if (sceneId.includes('BAD') || sceneId.includes('END')) {
                    sceneCard.classList.add('ending-scene');
                } else if (SCENES[sceneId].gameType || sceneId.includes('discover') || sceneId.includes('temptation')) {
                    sceneCard.classList.add('game-scene');
                }
                
                // 場景標題
                const sceneHeader = document.createElement('div');
                sceneHeader.className = 'p-4 border-b border-gray-700 flex justify-between items-center cursor-pointer hover:bg-white/5 transition';
                
                const sceneTitleText = getSceneTitle(sceneId);
                const sceneTitle = document.createElement('div');
                sceneTitle.innerHTML = `
                    <span class="scene-id-badge mr-2">${sceneId}</span>
                    <span class="font-bold text-lg text-white">${sceneTitleText}</span>
                `;
                
                // 下一個場景資訊
                let nextInfo = '';
                if (SCENES[sceneId].next) {
                    if (typeof SCENES[sceneId].next === 'function') {
                        nextInfo = '<span class="next-scene border border-green-800">動態分支函數</span>';
                    } else {
                        nextInfo = `<a href="#scene-${SCENES[sceneId].next}" class="next-scene jump-link border border-green-800">→ ${SCENES[sceneId].next}</a>`;
                    }
                } else if (SCENES[sceneId].choices) {
                    nextInfo = `<span class="next-scene border border-green-800">${SCENES[sceneId].choices.length} 個分支選擇</span>`;
                } else if (SCENES[sceneId].gameType) {
                    nextInfo = `<span class="next-scene border border-green-800">小遊戲: ${SCENES[sceneId].gameType}</span>`;
                } else {
                    nextInfo = `<span class="next-scene border border-gray-600 bg-gray-700 text-gray-400">結束/無後續</span>`;
                }
                
                const sceneNext = document.createElement('div');
                sceneNext.className = 'text-sm hidden sm:block';
                sceneNext.innerHTML = `<span class="text-gray-400">Next: </span>${nextInfo}`;
                
                sceneHeader.appendChild(sceneTitle);
                sceneHeader.appendChild(sceneNext);
                
                // 場景內容容器
                const sceneContent = document.createElement('div');
                sceneContent.className = 'p-1';
                
                // 顯示背景圖片資訊
                if (SCENES[sceneId].bg) {
                    const bgInfo = document.createElement('div');
                    bgInfo.className = 'p-2 px-4 bg-gray-900/50 m-2 rounded text-sm flex items-center gap-2';
                    bgInfo.innerHTML = `
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span class="text-gray-400">背景: </span>
                        <span class="text-amber-200 font-mono">${getImageName(SCENES[sceneId].bg)}</span>
                    `;
                    sceneContent.appendChild(bgInfo);
                }
                
                // 顯示對話腳本
                if (SCENES[sceneId].script && SCENES[sceneId].script.length > 0) {
                    SCENES[sceneId].script.forEach((line, index) => {
                        const lineDiv = document.createElement('div');
                        lineDiv.className = 'dialogue-line';
                        
                        // 獲取角色名稱
                        let charName = '旁白';
                        let charClass = 'character-narrator';
                        
                        if (line.char) {
                            // 處理 char 是物件或字串的情況
                            if (typeof line.char === 'string') {
                                charName = line.char;
                            } else if (line.char.name) {
                                charName = line.char.name;
                            }
                            
                            // 根據角色設置樣式
                            if (charName.includes('辛棄疾')) charClass = 'character-xin';
                            else if (charName === '我') charClass = 'character-me';
                            else if (charName === '葉知秋') charClass = 'character-ye';
                            else if (charName === '貴婦') charClass = 'character-lady';
                            else if (charName === '老師') charClass = 'character-teacher';
                            else if (charName === '？？？') charClass = 'character-uxin';
                        }
                        
                        lineDiv.innerHTML = `
                            <div class="flex w-full">
                                <div class="w-24 flex-shrink-0 pt-1">
                                    <span class="${charClass} font-medium text-sm block truncate pr-2">${charName}</span>
                                </div>
                                <div class="flex-grow">
                                    <span class="text-gray-300 dialogue-text">${escapeHtml(line.text)}</span>
                                </div>
                                <div class="w-8 text-right text-gray-600 text-xs pt-1 select-none">
                                    ${index + 1}
                                </div>
                            </div>
                        `;
                        
                        sceneContent.appendChild(lineDiv);
                    });
                } else {
                    const noScriptDiv = document.createElement('div');
                    noScriptDiv.className = 'p-4 text-center text-gray-500 italic';
                    noScriptDiv.textContent = '此場景無對話內容';
                    sceneContent.appendChild(noScriptDiv);
                }
                
                // 顯示選擇選項
                if (SCENES[sceneId].choices && SCENES[sceneId].choices.length > 0) {
                    const choicesHeader = document.createElement('div');
                    choicesHeader.className = 'p-2 mx-3 mt-4 mb-2 border-b border-gray-700 font-bold text-amber-200 text-sm uppercase tracking-wider';
                    choicesHeader.textContent = '分支選項';
                    sceneContent.appendChild(choicesHeader);
                    
                    SCENES[sceneId].choices.forEach((choice, index) => {
                        const choiceDiv = document.createElement('div');
                        choiceDiv.className = 'choice-option rounded m-3';
                        
                        let targetInfo = '';
                        if (choice.target) {
                            if (typeof choice.target === 'function') {
                                targetInfo = '<span class="text-purple-400 text-sm ml-2">[動態計算]</span>';
                            } else {
                                targetInfo = `<a href="#scene-${choice.target}" class="jump-link text-sm ml-2 font-mono">→ ${choice.target}</a>`;
                            }
                        }
                        
                        choiceDiv.innerHTML = `
                            <div class="font-medium text-white">${index + 1}. ${escapeHtml(choice.text)}</div>
                            <div class="text-sm text-gray-400 mt-1 flex gap-4">
                                <span>目標: ${targetInfo}</span>
                                ${choice.weights ? `<span>權重: <code class="bg-gray-800 px-1 rounded">${JSON.stringify(choice.weights)}</code></span>` : ''}
                            </div>
                        `;
                        
                        sceneContent.appendChild(choiceDiv);
                    });
                }
                
                // 顯示小遊戲配置
                if (SCENES[sceneId].gameType || SCENES[sceneId].config) {
                    const gameHeader = document.createElement('div');
                    gameHeader.className = 'p-2 mx-3 mt-4 mb-2 border-b border-gray-700 font-bold text-purple-300 text-sm uppercase tracking-wider';
                    gameHeader.textContent = SCENES[sceneId].gameType ? `GAME: ${SCENES[sceneId].gameType}` : 'GAME CONFIG';
                    sceneContent.appendChild(gameHeader);
                    
                    if (SCENES[sceneId].config) {
                        const configDiv = document.createElement('div');
                        configDiv.className = 'p-3 m-3 bg-gray-900/50 rounded text-sm grid grid-cols-1 md:grid-cols-2 gap-2';
                        configDiv.innerHTML = `
                            <div><span class="text-gray-400">目標提示:</span> <span class="text-amber-200">${SCENES[sceneId].config.targetHint || '無'}</span></div>
                            <div><span class="text-gray-400">時間限制:</span> <span class="text-amber-200">${SCENES[sceneId].config.timeLimit || '無'} 秒</span></div>
                            <div><span class="text-gray-400">成功跳轉:</span> <a href="#scene-${SCENES[sceneId].config.nextPass}" class="jump-link font-mono">${SCENES[sceneId].config.nextPass}</a></div>
                            <div><span class="text-gray-400">失敗跳轉:</span> <a href="#scene-${SCENES[sceneId].config.nextFail}" class="jump-link font-mono">${SCENES[sceneId].config.nextFail}</a></div>
                        `;
                        sceneContent.appendChild(configDiv);
                    }
                }
                
                // 添加到卡片
                sceneCard.appendChild(sceneHeader);
                sceneCard.appendChild(sceneContent);
                
                // 添加到容器
                scenesContainer.appendChild(sceneCard);
            });
            
            // 添加事件監聽器
            setupEventListeners();
            
            // 隱藏載入訊息
            document.getElementById('loading-message').style.display = 'none';
        }
        
        // 獲取場景標題
        function getSceneTitle(sceneId) {
            // 自定義標題映射
            if (sceneId === 'start') return '序幕：現代課堂';
            if (sceneId === 'flow') return '穿越：抵達南宋';
            if (sceneId.includes('market')) return '市集初遇';
            if (sceneId.includes('ye')) return '繁華夜市';
            if (sceneId.includes('discover')) return '小遊戲：尋找繁華';
            if (sceneId.includes('restaurant')) return '酒樓重逢';
            if (sceneId.includes('temptation')) return '小遊戲：拒絕誘惑';
            if (sceneId.includes('see_women')) return '高潮：眾裡尋他';
            if (sceneId.includes('wakeup')) return '結局：夢醒時分';
            if (sceneId === 'cast') return '製作人員';
            if (sceneId === 'title') return '返回標題';
            
            return sceneId;
        }
        
        // 獲取圖片名稱
        function getImageName(url) {
            if (!url) return '無';
            
            // 嘗試解析 URL，如果是相對路徑則直接處理
            try {
                // 如果是完整的 URL
                if (url.startsWith('http') || url.startsWith('data:')) {
                    const urlObj = new URL(url);
                    return urlObj.pathname.split('/').pop();
                } 
                // 相對路徑
                else {
                    const parts = url.split('/');
                    return parts[parts.length - 1];
                }
            } catch (e) {
                return url;
            }
        }
        
        // HTML 轉義
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 設置事件監聽器
        function setupEventListeners() {
            // 搜尋功能
            const searchInput = document.getElementById('search-scenes');
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase().trim();
                const sceneCards = document.querySelectorAll('.scene-card');
                
                if (searchTerm === '') {
                    // 恢復所有內容顯示
                    sceneCards.forEach(card => {
                        card.style.display = 'block';
                        // 恢復對話行顯示
                        const lines = card.querySelectorAll('.dialogue-line');
                        lines.forEach(line => {
                            line.style.display = 'flex';
                            line.style.backgroundColor = '';
                            const textSpan = line.querySelector('.dialogue-text');
                            if(textSpan) textSpan.innerHTML = textSpan.textContent; // 清除高亮
                        });
                    });
                    return;
                }
                
                // 搜尋邏輯
                sceneCards.forEach(card => {
                    const sceneId = card.id.replace('scene-', '');
                    const sceneTitle = getSceneTitle(sceneId);
                    
                    // 檢查標題是否匹配
                    const titleMatch = sceneId.toLowerCase().includes(searchTerm) || 
                                     sceneTitle.toLowerCase().includes(searchTerm);
                    
                    let contentMatch = false;
                    const lines = card.querySelectorAll('.dialogue-line');
                    
                    // 檢查每一行對話
                    lines.forEach(line => {
                        const textSpan = line.querySelector('.dialogue-text');
                        if (!textSpan) return;
                        
                        const originalText = textSpan.textContent;
                        const lineText = originalText.toLowerCase();
                        
                        if (lineText.includes(searchTerm)) {
                            contentMatch = true;
                            line.style.display = 'flex';
                            line.style.backgroundColor = 'rgba(255, 179, 0, 0.1)';
                            
                            // 高亮文本
                            const regex = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                            textSpan.innerHTML = originalText.replace(regex, '<mark>$1</mark>');
                        } else {
                            // 如果標題匹配，則顯示所有行（不高亮），否則隱藏
                            if (titleMatch) {
                                line.style.display = 'flex';
                                line.style.backgroundColor = '';
                                textSpan.innerHTML = originalText;
                            } else {
                                line.style.display = 'none';
                                textSpan.innerHTML = originalText;
                            }
                        }
                    });
                    
                    // 決定卡片是否顯示
                    if (titleMatch || contentMatch) {
                        card.style.display = 'block';
                        // 如果是因為內容匹配而顯示，展開卡片
                        if (contentMatch) {
                            const content = card.querySelector('.scene-card > div:last-child');
                            if(content) content.style.display = 'block';
                        }
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
            
            // 展開/收合所有場景
            const toggleBtn = document.getElementById('toggle-all');
            toggleBtn.addEventListener('click', function() {
                isExpanded = !isExpanded;
                const sceneContents = document.querySelectorAll('.scene-card > div:last-child');
                
                sceneContents.forEach(content => {
                    content.style.display = isExpanded ? 'block' : 'none';
                });
                
                this.textContent = isExpanded ? '收合所有' : '展開所有';
            });
            
            // 點擊場景標題展開/收合內容
            document.querySelectorAll('.scene-card > div:first-child').forEach(header => {
                header.addEventListener('click', function() {
                    const content = this.nextElementSibling;
                    const isHidden = content.style.display === 'none';
                    content.style.display = isHidden ? 'block' : 'none';
                });
            });
        }
        
        // 頁面載入完成後開始提取資料
        document.addEventListener('DOMContentLoaded', extractScenesData);
        
        // 定期檢查更新（每5分鐘）
        setInterval(() => {
            if (allScenesLoaded) {
                console.log("定期檢查劇情更新...");
                extractScenesData();
            }
        }, 300 * 1000);
    </script>
</body>
</html>
