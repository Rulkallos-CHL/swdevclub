<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>青玉案·元夕：燈火闌珊處</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700;900&display=swap');
        
        /* --- 基礎設定 --- */
        :root {
            --vh: 100vh;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: calc(var(--vh, 1vh) * 100);
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #game-app {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 1600px;
            max-height: 900px;
            background-color: #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 1);
        }

        @media (max-width: 1024px) {
            #game-app {
                max-width: 100%;
                max-height: 100%;
                box-shadow: none;
            }
        }

        /* --- 背景與氛圍 --- */
        .scene-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease-in-out, transform 15s ease-out;
            z-index: 0;
            opacity: 0;
            filter: brightness(0.8);
            will-change: transform, opacity;
        }
        .scene-bg.active {
            opacity: 1;
            transform: scale(1.1);
        }
        
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 30%, rgba(0,0,0,0.4) 70%, rgba(0,0,0,1) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* --- 對話框系統 --- */
        #dialogue-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(10,5,0,0.95) 70%, rgba(0,0,0,0) 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem 4rem 3rem 4rem;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        #character-name-box {
            align-self: flex-start;
            margin-bottom: 0.8rem;
            background: linear-gradient(90deg, rgba(90, 26, 26, 0.9), transparent);
            padding: 5px 20px 5px 15px;
            border-left: 4px solid #ffb300;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(2px);
            visibility: hidden; /* 預設隱藏，避免空盒子 */
        }

        #character-name {
            font-size: 1.6rem;
            color: #ffca28;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .char-tag {
            font-size: 0.9rem;
            color: #ccc;
            font-style: italic;
        }

        #dialogue-text {
            font-size: 1.35rem;
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 4.5rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,1);
            position: relative;
        }

        @media (orientation: portrait) {
            #dialogue-layer {
                height: 45%;
                padding: 1.5rem 1.5rem 4rem 1.5rem;
            }
            #character-name { font-size: 1.3rem; }
            #dialogue-text { font-size: 1.15rem; line-height: 1.5; }
            .title-main { font-size: 3rem !important; }
            .title-sub { font-size: 1rem !important; margin-bottom: 2rem !important; }
        }

        @media (max-width: 900px) and (orientation: landscape) {
            #dialogue-layer { height: 50%; padding: 1rem 3rem 1rem 3rem; }
            #character-name { font-size: 1.2rem; }
            #dialogue-text { font-size: 1.1rem; }
            .choice-btn { padding: 10px 20px !important; font-size: 1rem !important; }
        }

        .next-indicator {
            position: absolute;
            bottom: 20px;
            right: 30px;
            width: 15px; 
            height: 15px; 
            border-right: 3px solid #ffb300;
            border-bottom: 3px solid #ffb300;
            transform: rotate(45deg);
            animation: pulse 1s infinite;
            display: none;
        }
        @keyframes pulse {
            0% { opacity: 0.3; transform: rotate(45deg) translate(0, 0); }
            50% { opacity: 1; transform: rotate(45deg) translate(5px, 5px); }
            100% { opacity: 0.3; transform: rotate(45deg) translate(0, 0); }
        }

        /* --- 選項系統 --- */
        #choices-container {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 20px;
        }

        .choice-btn {
            background: rgba(40, 40, 40, 0.95);
            border: 1px solid #555;
            border-left: 4px solid #888;
            color: #ddd;
            padding: 20px 25px;
            width: 100%;
            max-width: 600px;
            text-align: left;
            font-size: 1.1rem;
            font-family: 'Noto Serif TC', serif;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
            min-height: 60px; 
            display: flex;
            align-items: center;
        }
        .choice-btn:active, .choice-btn:hover {
            background: #2a1b15;
            border-color: #ffb300;
            border-left-color: #ffb300;
            color: #ffb300;
        }

        /* --- 標題畫面 --- */
        #title-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffb300;
            padding: 20px;
            text-align: center;
        }
        .title-main { font-size: 5rem; letter-spacing: 0.5rem; margin-bottom: 1rem; text-shadow: 0 0 20px #ffb300; line-height: 1.1; }
        .title-sub { font-size: 2rem; color: #888; margin-bottom: 4rem; letter-spacing: 0.2rem; }

        /* --- 小遊戲通用 UI --- */
        #minigame-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 40;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .game-area {
            position: relative;
            width: 90%;
            height: 70%;
            border: 2px solid #333;
            overflow: hidden;
            background: #111;
            border-radius: 8px;
        }
        
        /* 誘惑小遊戲 */
        .distraction-item {
            position: absolute;
            cursor: pointer;
            font-size: 1.5rem;
            animation: float linear infinite;
            user-select: none;
            padding: 20px;
            white-space: nowrap;
        }

        #transition-mask {
            position: absolute;
            inset: 0;
            background-color: #000;
            z-index: 100;           /* 確保蓋過標題畫面 */
            opacity: 0;             /* 預設透明 */
            pointer-events: none;   /* 預設不擋滑鼠 */
            transition: opacity 1.5s ease-in-out; /* 漸變時間 1.5秒 */
        }

        #transition-mask.active {
            opacity: 1;             /* 變黑 */
            pointer-events: all;    /* 變黑時阻擋操作 */
        }

        /* --- 按鈕點擊高亮特效 --- */
        .choice-btn.clicked {
            background-color: #ffb300 !important;
            color: #000 !important;
            border-color: #fff !important;
            box-shadow: 0 0 30px #ffb300, 0 0 15px #fff !important;
            transform: scale(1.05);
            transition: all 0.1s;
        }

        /* --- 結局畫面樣式 --- */
        #ending-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.85); /* 深色半透明背景 */
            z-index: 60;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 1.5s ease-in-out;
        }

        .ending-banner {
            width: 100%;
            padding: 40px 0;
            background: linear-gradient(90deg, transparent, rgba(168, 60, 60, 0.9), transparent); /* 紅色漸層背景 */
            text-align: center;
            color: #fff;
            transform: scale(0.9);
            animation: bannerPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 根據結局類型改變背景色 (可選) */
        .ending-banner.good {
            background: linear-gradient(90deg, transparent, rgba(60, 168, 80, 0.9), transparent); /* 綠色 */
        }

        #end-type {
            font-size: 1.2rem;
            letter-spacing: 5px;
            margin-bottom: 10px;
            font-weight: 300;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            color: #ffd700;
        }

        #end-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            font-family: 'Noto Serif TC', serif; /* 確保用襯線體 */
        }

        /* --- 立繪系統 --- */
        #character-portraits {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 20px 20px 20px; /* 減少底部padding讓人物更大 */
            box-sizing: border-box;
        }

        .portrait-slot {
            width: 45%; /* 增加寬度 */
            max-width: 550px; /* 增加最大寬度 */
            height: 85%; /* 增加高度 */
            max-height: 750px; /* 增加最大高度 */
            position: relative;
            overflow: hidden;
        }

        .portrait-slot.left {
            align-self: flex-start;
            margin-top: 3%; /* 減少上邊距 */
        }

        .portrait-slot.right {
            align-self: flex-end;
        }

        .character-illustration {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: contain;
            object-position: bottom;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease, filter 0.8s ease;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.5));
            will-change: opacity, transform;
        }

        .character-illustration.active {
            opacity: 1;
            transform: translateY(0);
        }

        .character-illustration.speaking {
            filter: drop-shadow(0 0 25px rgba(255, 179, 0, 0.4)) brightness(1.15);
        }

        .character-illustration.fading {
            opacity: 0.6; /* 從 0.3 改為 0.6，更明顯 */
            filter: brightness(0.85) drop-shadow(0 0 10px rgba(0,0,0,0.3));
        }

        /* --- Control Bar (NEW) --- */
        #control-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            padding: 10px 20px;
            display: flex;
            gap: 15px;
            z-index: 20;
        }

        .control-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #555;
            color: #888;
            padding: 8px 20px;
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn:hover {
            color: #ffb300;
            border-color: #ffb300;
            background: rgba(0, 0, 0, 0.8);
        }

        .control-btn.active {
            color: #000;
            background: #ffb300;
            border-color: #ffb300;
            box-shadow: 0 0 10px #ffb300;
        }

        /* --- History Overlay (NEW) --- */
        #history-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        #history-container {
            width: 80%;
            height: 80%;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #444;
            padding: 30px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #history-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ccc;
        }

        /* Scrollbar styling */
        #history-content::-webkit-scrollbar { width: 8px; }
        #history-content::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        #history-content::-webkit-scrollbar-track { background: #111; }

        .history-entry { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .history-name { color: #ffb300; font-weight: bold; margin-right: 10px; font-size: 1rem; }
        .history-text { color: #e0e0e0; }

        .close-history {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #666;
            font-size: 2rem;
            cursor: pointer;
        }
        .close-history:hover { color: #fff; }

        /* 響應式調整 */
        @media (max-width: 1024px) {
            #character-portraits {
                padding: 0 15px 20px 15px;
            }
            
            .portrait-slot {
                width: 45%;
                height: 70%;
            }
        }

        @media (max-width: 768px) {
            .portrait-slot {
                width: 48%;
                height: 60%;
            }
        }

        @media (orientation: portrait) {
            #character-portraits {
                padding: 0 10px 10px 10px;
            }
            
            .portrait-slot {
                height: 50%;
                max-height: 400px;
            }
        }

        @keyframes bannerPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }
        
        /* Discover Game Style */
        @keyframes discoverZoom {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

    </style>
</head>

<body>
    
    <div id="game-app">
        <div id="transition-mask"></div>

        <div id="title-screen">
            <h1 class="title-main">青玉案 · 元夕</h1>
            <h2 class="title-sub">眾裡尋他千百度，驀然迴首，那人卻在，燈火闌珊處</h2>
            <button class="choice-btn" style="text-align: center; font-size: 1.4rem; width: auto; justify-content: center; border-left: 3px solid #555; border-right: 3px solid #555; border-top: 2px solid #555; border-bottom: 2px solid #555;" onclick="startGame(this)">入夢 · 淳熙二年元夕</button>
            <br>
            <p style="margin-top: 20px; color: #555; font-size: 1.75rem;">《青玉案 · 元夕》題材 GALGAME</p>
        </div>

        <div id="scene-bg-1" class="scene-bg"></div>
        <div id="scene-bg-2" class="scene-bg"></div>

        <div id="character-portraits">
            <div class="portrait-slot left" data-side="left"></div>
            <div class="portrait-slot right" data-side="right"></div>
        </div>
        
        <div class="vignette"></div>

        <div id="particles" style="position:absolute; inset:0; pointer-events:none;"></div>

        <div id="choices-container" style="display: none;"></div>

        <div id="minigame-overlay"></div>

        <div id="dialogue-layer" style="display: none;" onclick="handleDialogueClick()">
            <div id="character-name-box">
                <span id="character-name"></span>
                <span class="char-tag"></span>
            </div>
            
            <div id="dialogue-text"></div>
            
            <div class="next-indicator" id="next-indicator"></div>

            <div id="control-bar" onclick="event.stopPropagation()">
                <button class="control-btn" onclick="toggleHistory(event)">紀錄</button>
                <button class="control-btn" id="btn-auto" onclick="toggleAuto(event)">自動</button>
                <button class="control-btn" onclick="confirmQuit(event)">退出</button>
            </div>
        </div>

        <div id="history-overlay" style="display: none;" onclick="toggleHistory(event)">
            <div id="history-container" onclick="event.stopPropagation()">
                <h2 style="color: #ffb300; border-bottom: 1px solid #555; padding-bottom: 10px; margin-bottom: 15px;">劇情紀錄</h2>
                <div id="history-content"></div>
                <button class="close-history" onclick="toggleHistory(event)">×</button>
            </div>
        </div>
    </div>

<script>
        // ==================== 全局變數初始化 ====================
        let characterLastAppearance = {};  // 集中管理角色出場追蹤
        let activePortraits = { left: null, right: null };  // 統一管理立繪狀態
        
        // [FEATURE] New Globals
        let historyLog = [];
        let autoTimer = null;
        let isAuto = false;

        // --- 手機視窗高度修正 ---
        function setVh() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', setVh);
        setVh();

        // --- 資源配置 ---
        const IMAGES = {

            RESTAURANT: 'https://rulkallos-chl.github.io/img/蛾兒雪柳黃金縷_笑語盈盈暗香去.jpg',

            CLASSROOM:  'https://rulkallos-chl.github.io/img/classroom_from_backmost.jpg'
        };

        const CHARS = {
            XIN: { 
                name: "辛棄疾", 
                tag: "憂國憂民", 
                color: "#ffca28",
                portrait: "https://rulkallos-chl.github.io/img/xin_portrait.png",
                side: "left"
            },
            UXIN: {

            LADY: {

            },
            NARRATOR: { 
                name: "",

                portrait: null
            },
            TEACHER: {
                name: "老師", 
                tag: "", 
                color: "#e0e0e0",
                portrait: "https://rulkallos-chl.github.io/img/teacher_portrait.png",
                side: "left"
            }
        };

        const SCENES = {
            // ============================================================
            //  第一章：序幕 & 穿越
            // ============================================================
            'start': {
                bg: IMAGES.START,
                script: [
                    { char: CHARS.NARRATOR, text: "又是一個普通的上學天。" },
                    { char: CHARS.NARRATOR, text: "又是一個沉悶的中文課。" },
                    { char: CHARS.ME, text: "（昨晚打游戲機打到凌晨三點，現在根本清醒不了啊！）" },
                    { char: CHARS.ME, text: "（算了，睡就睡吧，醒來最多被老師罵……）" },
                    { char: CHARS.NARRATOR, text: "老師的聲音在耳邊漸漸模糊，化作一片嗡嗡的背景音。" },
                    { char: CHARS.NARRATOR, text: "我趴在攤開的課本上，眼皮沉重地合攏，最後映入眼簾的，是辛棄疾那首《青玉案·元夕》。" }
                ],
                next: 'flow'  // flow
            },

            'flow': {
                bg: IMAGES.FLOW,
                script: [
                    { char: CHARS.NARRATOR, text: "……一陣極致的黑暗與寂靜過後，震耳欲聾的喧囂猛地將我淹沒。" },
                    { char: CHARS.NARRATOR, text: "刺鼻的硝煙味混雜著濃郁的脂粉香撲面而來，腳下青石板傳來微微震動，我愕然睜眼，但見繁華的夜市在眼前。" },
                ],
                next: 'scene_market#1'
            },

            // ============================================================
            //  第二章：初遇辛棄疾 (分支選擇)
            // ============================================================
            'scene_market#1': {
                bg: IMAGES.MARKET,
                script: [
                    { char: CHARS.ME, text: "啪！（打自己一巴掌）" },
                    { char: CHARS.ME, text: "（這不是夢！我竟在打瞌睡間，來到了這陌生的繁華市集！？）" },
                    { char: CHARS.NARRATOR, text: "夜空彷彿被劃破，無數道喧嘯的火龍竄上天際，在到達穹頂點時炸開，化作千萬朵轉瞬即逝的銀花。" },
                    { char: CHARS.NARRATOR, text: "爆炸的轟鳴聲此起彼落，震得腳下的青石板都在微微顫抖。" },
                    { char: CHARS.NARRATOR, text: "空氣中瀰漫著一陣肅殺，仍掩蓋不了繁華夜市中濃鬱的脂粉味與酒肉香。" },
                    { char: CHARS.NARRATOR, text: "這種難以言語的氣味，渾濁得令人作嘔。" },
                    { char: CHARS.NARRATOR, text: "我在大街的人潮中，被興奮狂歡的百姓推擠得東倒西歪。" },
                    { char: CHARS.NARRATOR, text: "但我身邊的那人，卻像是定海神針，任憑濁浪排空，紋絲不動。" },
                    { char: CHARS.ME, text: "先生……呃，請問現在是什麽年份？" },
                    { char: CHARS.ME, text: "……這裏又是哪裏？" },
                    { char: CHARS.NARRATOR, text: "那人看著你，仔細地看著你身上過於現代的西式校服。" },
                    { char: CHARS.UXIN, text: "現在乃是淳熙二年，這裏便是臨安城。" },
                    { char: CHARS.UXIN, text: "我觀閣下的裝扮獨特，不似我宋人。敢問閣下何人，從何而來？" },
                    { char: CHARS.ME, text: "嗯……我叫李一心，是西域來到的……" },
                    { char: CHARS.NARRATOR, text: "那人若有所思。" },
                    { char: CHARS.ME, text: "那麽先生又是？" },
                    { char: CHARS.UXIN, text: "尋常的騷人罷了。" },
                    { char: CHARS.ME, text: "（嗯……在這繁華之中穿搭如此平凡，還戴著一柄破舊的佩劍！）" },
                    { char: CHARS.ME, text: "敢問先生，可名叫辛棄疾？" },
                    { char: CHARS.ME, text: "啊啊！應該叫您辛大人。" },
                    { char: CHARS.NARRATOR, text: "那人微微一驚。" },
                    { char: CHARS.UXIN, text: "噢？居然知道我這個小官嗎？" },
                    { char: CHARS.XIN, text: "不錯。在下便是辛棄疾。" },
                    { char: CHARS.XIN, text: "不想未曾到訪臨安的西域友人竟然也知在下小名，實屬榮幸。" },
                    { char: CHARS.ME, text: "（不是哥們，還真是你啊！）" },
                    { char: CHARS.ME, text: "（原來他便是辛棄疾嗎？……三十開外，眼角已有風霜的刻痕，但雙目依然如此炯炯有神。）" },
                    { char: CHARS.NARRATOR, text: "我不得不提高聲量，才能蓋過周遭的喧囂。" },
                    { char: CHARS.ME, text: "先生，這可真是盛世啊……" },
                    { char: CHARS.NARRATOR, text: "他仰望夜空，目光並未落在那些絢爛的煙花上，而是死死盯著煙火炸開後留下的黑色硝煙。" },
                    { char: CHARS.XIN, text: "盛？" },
                    { char: CHARS.XIN, text: "你聽這聲音，像不像霹靂炮擊破城牆的巨響？" },
                    { char: CHARS.NARRATOR, text: "我愣了一下。" }
                ],
                choices: [
                    {
                        text: "確實……這聲音帶著難以看見的殺伐之氣……",
                        target: 'scene_market#2',
                        weights: {
                            awakening: 5,
                            favor: 5
                        }
                    },
                    {
                        text: "看來《六國論》的結局已經應驗了……",
                        target: 'scene_market#4',
                        weights: {
                            awakening: 10,
                            favor: 10
                        }

                    },
                    {
                        text: "不會啊，這只是喜慶的煙火！",
                        target: 'scene_market#3',
                    }
                ],
            },

            'scene_market#2': {
                script: [
                    { char: CHARS.XIN, text: "你説的很對……" },
                    { char: CHARS.XIN, text: "在我聽來，這是鐵蹄踏碎河山的喪鐘！" },
                    { char: CHARS.NARRATOR, text: "辛棄疾猛地收回目光，看著眼前一張張因興奮而漲紅的臉孔，眼中流露出一種深深的悲憫與無奈。" },
                    { char: CHARS.XIN, text: "這些火藥，本該裝填在北伐的戰車上，去炸碎金人的鐵浮圖，去收復我們丟失的半壁江山。" },
                    { char: CHARS.XIN, text: "可現在呢？" },
                    { char: CHARS.XIN, text: "它們成了取悅權貴的玩具，成了粉飾這偏安小朝廷的脂粉！" },
                    { char: CHARS.NARRATOR, text: "他痛苦地閉了上眼。" },
                    { char: CHARS.XIN, text: "走吧。" },

                ],

            'scene_market#3': {

            'scene_market#4' : {
                script: [
                    { char: CHARS.NARRATOR, text: "辛棄疾震驚地看著你。" },
                    { char: CHARS.XIN, text: "閣下説的可是蘇洵老先生《嘉祐集》的《六國論》？" },
                    { char: CHARS.NARRATOR, text: "（你點頭回應）" },
                    { char: CHARS.XIN, text: "在下有眼不識泰山！" },
                    { char: CHARS.XIN, text: "是在下先入爲主，以貌取人了，竟然不知閣下雖爲西域人，也讀過老泉的著作！" },
                    { char: CHARS.NARRATOR, text: "説罷，他皺著眉地閉了上眼。" },
                    { char: CHARS.XIN, text: "閣下是我在這臨安，見過的唯一清醒……" },
                    { char: CHARS.XIN, text: "不知閣下對於《六國論》的論點有何見解？" },
                    { char: CHARS.NARRATOR, text: "辛棄疾似乎很着急地看著你。" }
                ],
                choices: [

                    },

            'scene_ye': {

                script: [
                    { char: CHARS.NARRATOR, text: "我們逆著人潮，試圖穿過這條流淌著金銀的河流。" },
                    { char: CHARS.NARRATOR, text: "道路中央，一輛接一輛極盡奢華的馬車緩緩駛過。" },

                    { char: CHARS.XIN, text: "卻在這裏成了炫耀的工具" },
                    { char: CHARS.XIN, text: "你可能找到這些「繁華」的跡象？" },

            // 小遊戲成功 -> 繼續劇情
            'scene_ye_cont': {
                script: [
                    { char: CHARS.NARRATOR, text: "（你從褲袋裏拿出手機拍攝下了這些所謂的繁華）" },
                    { char: CHARS.NARRATOR, text: "（辛棄疾看著你的操作不禁好奇和驚訝，問你借來手機端詳）" },
                    { char: CHARS.XIN, text: "這樣的小巧玲瓏之物居然有如此多的功能！" },
                    { char: CHARS.XIN, text: "我大宋居然已經淪落到了連西域也不如了嗎……" },
                    { char: CHARS.NARRATOR, text: "（辛棄疾把手機歸還后，看著夜市裏的衆人，嘆了口氣）" },
                    { char: CHARS.XIN, text: "不錯，就是這些寶馬、雕車、魚龍燈飾。" },
                    { char: CHARS.XIN, text: "歌舞升平，都是假象，一棵腐朽的參天大樹罷了。" },
                    { char: CHARS.XIN, text: "大樹日漸萎縮，越來越快。" },
                    { char: CHARS.XIN, text: "沒有人相信，也不願相信，這盛世早就過去了……大樹隨時都會倒塌，壓死在樹下乘涼的螻蟻！" },
                    { char: CHARS.NARRATOR, text: "忽然，一陣俗不可耐的香氣撲面而來，一輛雕花的馬車停在我們面前，擋住了去路。" },
                    { char: CHARS.NARRATOR, text: "車簾掀開，露出一張塗著厚厚脂粉、頭插金絲鳳釵的嬌容。" },
                    { char: CHARS.NARRATOR, text: "那是一位身著綾羅的貴婦。" },
                    { char: CHARS.NARRATOR, text: "她手持團扇，半遮著臉，醉眼朦朧地打量著我們這一老一少兩個布衣。" },
                    { char: CHARS.LADY, text: "哎喲，這是哪來的苦行僧？" },
                    { char: CHARS.NARRATOR, text: "她咯咯地笑著，轉頭對身邊的侍女說道。" },
                    { char: CHARS.LADY, text: "今夜元夕，滿城都在尋歡作樂，怎的還有這般眉頭緊鎖、一臉晦氣的人？" },
                    { char: CHARS.LADY, text: "真是掃興。" },
                    { char: CHARS.NARRATOR, text: "侍女捧著一個精緻的壺走上前，輕蔑地看著我們。" },
                    { char: CHARS.LADY, text: "這可是屠蘇酒，喝一杯吧，喝了就能忘了那些煩心事，快活似神仙。" },
                    { char: CHARS.NARRATOR, text: "酒香鑽入鼻孔，那是頂級的佳釀，帶著一種誘人的麻醉感。" },
                    { char: CHARS.NARRATOR, text: "辛棄疾看著那杯酒，眼神冷得像凜冬冰雪。" },
                    { char: CHARS.NARRATOR, text: "他沒有動，挺直了脊樑，冷冷開口。" },
                    { char: CHARS.XIN, text: "喝完這酒就忘卻了北方難嗎？" },
                    { char: CHARS.NARRATOR, text: "貴婦的笑容旋即僵住，隨即惱羞成怒。" },
                    { char: CHARS.LADY, text: "狂徒，胡說些什麼！" },
                    { char: CHARS.LADY, text: "這是太平盛世！" },
                    { char: CHARS.NARRATOR, text: "辛棄疾上前一步，逼視著車內的貴婦。" },
                    { char: CHARS.XIN, text: "太平？" },
                    { char: CHARS.XIN, text: "夫人的暖風薰得太久了，怕是早已忘了靖康恥，猶未雪，臣子恨，何時滅！" },
                    { char: CHARS.XIN, text: "忘了岳王爺的冤獄！" },
                    { char: CHARS.XIN, text: "也忘了這臨安城外，還有無數同胞在金人的皮鞭下苟延殘喘！" },
                    { char: CHARS.NARRATOR, text: "貴婦尖叫著，狠狠甩下車簾。" },
                    { char: CHARS.LADY, text: "瘋子！" },
                    { char: CHARS.LADY, text: "簡直是個瘋子！" },
                    { char: CHARS.LADY, text: "快走！" },
                    { char: CHARS.LADY, text: "別理這兩個瘋子！" },
                    { char: CHARS.NARRATOR, text: "馬車轟隆隆地駛過，很快沒入人群中。" },
                    { char: CHARS.NARRATOR, text: "辛棄疾站街道中，看著那遠去的背影，容顔中帶有一抹淒涼。" },
                    { char: CHARS.XIN, text: "你看，這就是臨安。" },
                    { char: CHARS.XIN, text: "你若清醒，便是瘋子。" },
                    { char: CHARS.XIN, text: "你若沈醉，反倒是個正常人了。" },
                    { char: CHARS.NARRATOR, text: "我的心頭一震，看著他蕭索的側影，忍不住問道。" },
                    { char: CHARS.ME, text: "先生，既然舉世皆濁，您為何還要這般自苦？" },
                    { char: CHARS.NARRATOR, text: "他低聲說道，聲音輕得幾乎被風吹散。" },
                    { char: CHARS.XIN, text: "因為總得有人記得。" },
                    { char: CHARS.XIN, text: "若連我也醉了，這大宋，就真的醒不了了。" },
                ],
                next: 'scene_restaurant#1'
            },

            // ============================================================
            //  第四章：舊友重逢 (葉知秋)
            // ============================================================
            'scene_restaurant#1': {
                bg: IMAGES.RESTAURANT,
                script: [
                    { char: CHARS.NARRATOR, text: "穿過最喧鬧的街，我們來到了一處酒樓之下。" },
                    { char: CHARS.NARRATOR, text: "樓上笙歌連連，絲竹之聲靡靡入耳。" },
                    { char: CHARS.NARRATOR, text: "一把醉醺醺的聲音從頭頂傳來。" },
                    { char: CHARS.YE, text: "稼軒？" },
                    { char: CHARS.YE, text: "是你嗎？" },
                    { char: CHARS.NARRATOR, text: "我們抬頭，只見一個一身錦衣的中年男子正倚著欄杆，手裡舉著酒杯，滿面紅光。" },
                    { char: CHARS.NARRATOR, text: "（葉知秋。）" },
                    { char: CHARS.NARRATOR, text: "（十年前，他曾與辛棄疾一同在江邊擊節高歌，發誓要「以此身許國，馬革裹屍還」。）" },
                    { char: CHARS.NARRATOR, text: "辛棄疾的眼睛亮了一下，彷彿在黑夜中看到了一絲火光。" },
                    { char: CHARS.XIN, text: "知秋？" },
                    { char: CHARS.NARRATOR, text: "葉知秋跌跌撞撞地跑下樓來，渾身酒氣沖天。" },
                    { char: CHARS.NARRATOR, text: "他手搭上辛棄疾的肩膀，大笑道。" },
                    { char: CHARS.YE, text: "我就知道是你！" },
                    { char: CHARS.YE, text: "這臨安城裡，只有你會在元宵節穿著一身布衣到處亂逛！" },

                    { char: CHARS.NARRATOR, text: "辛棄疾不動聲色地拂開了他的手，目光沈痛地審視著這位昔日的戰友。" },
                    { char: CHARS.XIN, text: "知秋，你還記得當年的誓言嗎？" },
                    { char: CHARS.XIN, text: "你說過，不復中原，誓不罷休。" },
                    { char: CHARS.XIN, text: "如今北地未復，你卻在這裡聽曲賞燈？" },
                    { char: CHARS.NARRATOR, text: "葉知秋臉上的笑容馬上僵住了。" },
                    { char: CHARS.NARRATOR, text: "他後退一步，眼中的醉意散去了些許，取而代之的是惱羞成怒的防禦。" },
                    { char: CHARS.NARRATOR, text: "他冷笑一聲，猛地將手中的酒杯摔在地上，碎片四濺。" },
                    { char: CHARS.YE, text: "誓言？" },
                    { char: CHARS.YE, text: "稼軒，你醒醒吧！" },
                    { char: CHARS.YE, text: "十年了！" },
                    { char: CHARS.YE, text: "我們喊了十年，朝廷聽了嗎？" },
                    { char: CHARS.YE, text: "官大爺們聽了嗎？" },
                    { char: CHARS.YE, text: "沒有！" },
                    { char: CHARS.YE, text: "他們只想議和，給金狗送銀子，只想守著這半壁江山過安穩日子！" },
                    { char: CHARS.NARRATOR, text: "辛棄疾的聲音在顫抖，壓抑著極大的憤怒。" },
                    { char: CHARS.XIN, text: "所以你就放棄了？" },
                    { char: CHARS.NARRATOR, text: "葉知秋歇斯底里地吼道，指著周圍流光溢彩的街道。" },
                    { char: CHARS.YE, text: "我不放棄又能如何？" },
                    { char: CHARS.YE, text: "誰想打仗？" },
                    { char: CHARS.YE, text: "誰想死？" },
                    { char: CHARS.YE, text: "只有你，辛棄疾，只有你還抱著那把破劍要做什麽攘除奸凶，還於舊都！" },
                    { char: CHARS.YE, text: "我累了，我想過舒坦日子，有錯嗎？" },
                    { char: CHARS.NARRATOR, text: "辛棄疾沈默了。" },
                    { char: CHARS.YE, text: "這位小友，又是怎麽看的？" },
                    { char: CHARS.NARRATOR, text: "想必也是就這樣及時行樂吧？" },

            'scene_see_women': {
                bg: IMAGES.DARK,
                script: [
                    { char: CHARS.NARRATOR, text: "離開鬧市，我們往陋巷而行。" },
                    { char: CHARS.NARRATOR, text: "身後的喧囂聲逐漸遠去，變成了背景裡模糊的嗡嗡聲。" },
                    { char: CHARS.NARRATOR, text: "那種紙醉金迷的光芒也褪去，取而代之的是清冷的月光和稀疏的星子。" },
                    { char: CHARS.NARRATOR, text: "空氣終於乾淨。" },
                    { char: CHARS.NARRATOR, text: "這是一條老舊的長街，兩旁的店鋪早已打烊，只有零星幾戶人家還亮著燈。" },
                    { char: CHARS.NARRATOR, text: "沒有什麽寶馬、雕車，也沒有黃金、笑語，只有偶爾幾聲犬吠，和寒風吹過樹梢的沙沙聲。" },
                    { char: CHARS.NARRATOR, text: "辛棄疾走得很慢，彷彿在尋找著什麼。" },

                    { char: CHARS.XIN, text: "我在找人。" },
                    { char: CHARS.ME, text: "找誰？" },
                    { char: CHARS.XIN, text: "找一個……還醒著的人。" },
                    { char: CHARS.NARRATOR, text: "辛棄疾停下腳步，望著這條空蕩蕩的長街，聲音充滿了疲憊。" },
                    { char: CHARS.XIN, text: "這偌大的臨安城，百萬人，難道真的全都醉死了嗎？" },
                    { char: CHARS.XIN, text: "難道就沒有一個人，肯在繁華之外，不失其本心嗎？" },

                    { char: CHARS.NARRATOR, text: "他的聲音在空曠的街道上迴盪，終歸寂靜。" },

                    { char: CHARS.NARRATOR, text: "不是脂粉香，也不是酒肉香，而是一種淡淡的、冷冽的暗香。" },
                    { char: CHARS.NARRATOR, text: "辛棄疾猛地抬起頭，目光如炬，看向街道盡頭的陰影處。" },
                    { char: CHARS.NARRATOR, text: "那裡，遠離了燈火通明的鬧市，光線昏暗。" },
                    { char: CHARS.NARRATOR, text: "但在那零星的燈火下，立著一位女子。" },
                    { char: CHARS.NARRATOR, text: "她沒有穿紅戴綠，只穿著一身素淨的布裙。" },
                    { char: CHARS.NARRATOR, text: "她沒有在人群中擠笑，而是靜靜地站在那裡，手裡提著一盞小小的兔子燈，正抬頭看著路邊的一株梅花。" },
                    { char: CHARS.NARRATOR, text: "那株梅花開得正好，傲雪凌霜，在寒風中輕輕搖曳。" },
                    { char: CHARS.NARRATOR, text: "她看見了我們，目光在辛棄疾身上停留了一瞬。" },
                    { char: CHARS.NARRATOR, text: "她似乎並不認識這位將名滿天下的詞人，也不在意他身上那種與眾不同的氣質。" },
                    { char: CHARS.NARRATOR, text: "她只是禮貌地微微頷首，嘴角泛起一絲淡淡的、幾乎看不見的笑意，然後便低下頭。" },
                    { char: CHARS.NARRATOR, text: "辛棄疾怔怔地站在那裡，一動也不動。" },
                    { char: CHARS.NARRATOR, text: "他看著那女子，目光從最初的驚訝，漸漸變得柔和，最後湧動起一種難以言喻的激動與慰藉。" },
                    { char: CHARS.NARRATOR, text: "在那一瞬間，他彷彿在鏡子裡看到了另一個自己。" },
                    { char: CHARS.NARRATOR, text: "那個女子雖然身在市井，一身布衣，但她的靈魂卻沒有向這浮華的世道低頭。" },
                    { char: CHARS.NARRATOR, text: "她甘於寂寞，守著這盞微弱的燈火，做著自己認為正確的事情。" },
                    { char: CHARS.NARRATOR, text: "她不隨波逐流，不慕虛榮，在這喧囂的長夜裡，獨自清醒，獨自芬芳。" },
                    { char: CHARS.NARRATOR, text: "這不正是他苦苦尋覓的「那人」嗎？" },
                    { char: CHARS.NARRATOR, text: "眾裡尋他千百度。" },
                    { char: CHARS.NARRATOR, text: "他在朝堂上找過，在軍營裡找過，在酒肆裡找過，在無數張燈結彩的面孔中找過，卻都一無所獲。" },
                    { char: CHARS.NARRATOR, text: "卻沒想到，驀然迴首，那人卻在，燈火闌珊處。" },
                    { char: CHARS.NARRATOR, text: "辛棄疾深吸了一口氣，那口氣彷彿吐盡了胸中積鬱已久的濁氣。" },
                    { char: CHARS.NARRATOR, text: "他的肩膀不再緊繃，臉上的線條也柔和了下來。" },
                    { char: CHARS.ME, text: "先生？" },
                    { char: CHARS.NARRATOR, text: "辛棄疾沒有說話，他只是對著那盞孤燈，對著那位女子，深深地作了一個揖。" },
                    { char: CHARS.NARRATOR, text: "然後，他轉過身，大步向黑暗中走去。" },
                    { char: CHARS.XIN, text: "走吧。" },
                    { char: CHARS.NARRATOR, text: "他的聲音不再蒼涼，而是充滿了一種新生的力量，如同金石落地，擲地有聲。" },
                    { char: CHARS.XIN, text: "天快亮了。" },
                    { char: CHARS.ME, text: "先生！" },
                    { char: CHARS.ME, text: "請等等…呃啊…" },

        // ==================== 核心函數定義 ====================

        // 在遊戲開始前預加載立繪圖片
        function preloadPortraits() {
            const portraitUrls = [];
            Object.values(CHARS).forEach(char => {
                if (char.portrait) {
                    portraitUrls.push(char.portrait);
                }
            });
            portraitUrls.forEach(url => {
                const img = new Image();
                img.src = url;
            });
        }
        // 在頁面加載完成後調用
        window.addEventListener('DOMContentLoaded', preloadPortraits);

        function startGame(btn) {
            // 1. 按鈕瞬間發光 (高亮特效)
            if(btn) btn.classList.add('clicked');

            // 2. 取得轉場遮罩
            const mask = document.getElementById('transition-mask');

            // 3. 延遲 300ms 讓玩家看清楚按鈕發光，然後開始變黑
            setTimeout(() => {
                mask.classList.add('active');
            }, 300);

            // 4. 等待畫面完全變黑 (1.5秒) 後，切換場景
            setTimeout(() => {
                // 隱藏標題畫面
                document.getElementById('title-screen').style.display = 'none';
                
                clearPortraits();
                resetCharacterTracking();

                // 執行原本的場景初始化邏輯
                const bg1 = document.getElementById('scene-bg-1');
                bg1.style.backgroundImage = `url('${SCENES['start'].bg}')`;
                bg1.classList.add('active');

                document.getElementById('dialogue-layer').style.display = 'flex';
                state.bgSlot = 1;
                loadScene('start');

                // 5. 場景加載好後，讓畫面變亮 (移除 active)
                mask.classList.remove('active');

            }, 1800);
        }

        // 狀態變數
        let state = {
            scene: 'start',
            index: 0,
            bgSlot: 1,
            isTyping: false,
            weights: {
                awakening: 0, 
                favor: 0 
            },
            isAuto: false // Keep consistent with global
        };

        // ==================== NEW FEATURE LOGIC ====================

        function toggleHistory(e) {
            if (e) e.stopPropagation();
            const overlay = document.getElementById('history-overlay');
            const content = document.getElementById('history-content');
            
            if (overlay.style.display === 'none' || overlay.style.display === '') {
                // Show History
                overlay.style.display = 'flex';
                // Render
                content.innerHTML = historyLog.map(entry => `
                    <div class="history-entry">
                        <span class="history-name">${entry.name}</span>
                        <span class="history-text">${entry.text}</span>
                    </div>
                `).join('');
                // Scroll to bottom
                content.scrollTop = content.scrollHeight;
            } else {
                // Hide History
                overlay.style.display = 'none';
            }
        }

        function toggleAuto(e) {
            if (e) e.stopPropagation();
            state.isAuto = !state.isAuto; // Toggle State
            
            const btn = document.getElementById('btn-auto');
            if (state.isAuto) {
                btn.classList.add('active');
                // If text is already finished, trigger the advance immediately
                if (!state.isTyping && document.getElementById('next-indicator').style.display !== 'none') {
                    handleDialogueClick();
                }
            } else {
                btn.classList.remove('active');
                if (autoTimer) clearTimeout(autoTimer);
            }
        }

        function confirmQuit(e) {
            if (e) e.stopPropagation();
            
            // Pause Auto if active
            if (state.isAuto) toggleAuto();

            if (confirm("確定要返回標題畫面嗎？\n未保存的進度將會丟失。")) {
                loadScene('title');
            }
        }

        function addToHistory(line) {
            // Prevent duplicate consecutive entries
            if (historyLog.length > 0) {
                const last = historyLog[historyLog.length - 1];
                const currentName = line.char ? line.char.name : '';
                if (last.text === line.text && last.name === currentName) return;
            }

            const entry = {
                name: line.char ? line.char.name : '',
                text: line.text
            };
            historyLog.push(entry);

            // [FIX] Live Update: If history is open, append the new line immediately
            const overlay = document.getElementById('history-overlay');
            if (overlay.style.display !== 'none') {
                const content = document.getElementById('history-content');
                const entryDiv = document.createElement('div');
                entryDiv.className = 'history-entry';
                entryDiv.innerHTML = `
                    <span class="history-name">${entry.name}</span>
                    <span class="history-text">${entry.text}</span>
                `;
                content.appendChild(entryDiv);
                // Auto-scroll to bottom to follow the new text
                content.scrollTop = content.scrollHeight;
            }
        }

        // ==================== LOGIC ====================

        function finishType() {
            state.isTyping = false;
            document.getElementById('next-indicator').style.display = 'block';

            // [FEATURE] Add to History Log
            const scene = SCENES[state.scene];
            if (scene && scene.script && scene.script[state.index]) {
                addToHistory(scene.script[state.index]);
            }

            // [FEATURE] Auto Play Logic
            if (state.isAuto) {
                if (autoTimer) clearTimeout(autoTimer);
                // Wait 0.5s before advancing
                autoTimer = setTimeout(() => {
                    // Check if still auto (user might have cancelled in the split second)
                    if (state.isAuto) {
                        handleDialogueClick();
                    }
                }, 1250);
            }
        }

        function handleDialogueClick() {
            // If user manually clicks, stop the pending auto timer
            if (autoTimer) clearTimeout(autoTimer);

            const scene = SCENES[state.scene];
            if (!scene || !scene.script) return;
            
            // Don't advance if choices are visible
            if (document.getElementById('choices-container').style.display !== 'none') return;

            if (state.isTyping) {
                // If typing, skip to end
                state.isTyping = false;
            } else {
                // Next line
                state.index++;
                renderDialogue();
            }
        }

        function renderChoices(choices) {
            // [UX CHANGE] Do NOT turn off Auto, just ensure no pending timer exists
            if (autoTimer) clearTimeout(autoTimer);

            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            container.style.display = 'flex';
            hideAllPortraits();

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    
                    // Weight Logic
                    if (choice.weights) {
                        for (let key in choice.weights) {
                            if (state.weights.hasOwnProperty(key)) {
                                state.weights[key] += choice.weights[key];
                            }
                        }
                    }

                    container.style.display = 'none';
                    
                    // Navigation Logic
                    let nextScene = choice.target;
                    if (!nextScene) {
                        // If no target, just advance index (simple branch merge)
                        state.index++;
                        renderDialogue();
                    } else {
                        loadScene(nextScene);
                    }
                };
                container.appendChild(btn);
            });
        }

        // 清除所有立繪
        function clearPortraits() {
            const portraitsContainer = document.getElementById('character-portraits');
            portraitsContainer.querySelectorAll('.portrait-slot').forEach(slot => {
                slot.innerHTML = '';
            });
            activePortraits.left = null;
            activePortraits.right = null;
        }
        
        // 隱藏所有立繪 (用於旁白或特殊場景)
        function hideAllPortraits() {
             const portraitsContainer = document.getElementById('character-portraits');
             portraitsContainer.querySelectorAll('.character-illustration').forEach(img => {
                 img.classList.remove('active');
             });
             activePortraits.left = null;
             activePortraits.right = null;
        }

        // 分析場景，找出每個角色的最後出場位置
        function analyzeSceneForLastAppearances(sceneId) {
            const scene = SCENES[sceneId];
            if (!scene || !scene.script) return;
            
            characterLastAppearance = {};
            
            scene.script.forEach((line, index) => {
                if (line.char && line.char.name) {
                    characterLastAppearance[line.char.name] = index;
                }
            });
        }

        // 重置角色追蹤
        function resetCharacterTracking() {
            characterLastAppearance = {};
        }

        // 檢查是否需要完全淡化某個角色
        function checkForFinalFade(characterName, currentIndex) {
             if (!characterName || !characterLastAppearance[characterName]) return false;
             return currentIndex >= characterLastAppearance[characterName];
        }

        // 更新立繪顯示，處理完全淡化
        function updateCharacterPortraitWithFade(char, currentIndex) {
            const portraitsContainer = document.getElementById('character-portraits');

            if (char === CHARS.NARRATOR || !char.portrait) {
                hideAllPortraits();
                return;
            }
            
            const shouldFadeCompletely = checkForFinalFade(char.name, currentIndex);
            const side = char.side || "left";
            const oppositeSide = side === "left" ? "right" : "left";

            const slot = portraitsContainer.querySelector(`.portrait-slot[data-side="${side}"]`);
            const oppositeSlot = portraitsContainer.querySelector(`.portrait-slot[data-side="${oppositeSide}"]`);

            if (oppositeSlot) {
                const oppositeImg = oppositeSlot.querySelector('.character-illustration');
                if (oppositeImg) {
                    oppositeImg.classList.remove('speaking');
                    oppositeImg.classList.add('fading');
                }
            }

            let currentImg = slot.querySelector('.character-illustration');
            
            if (!currentImg || currentImg.src !== char.portrait) {
                slot.innerHTML = '';
                const img = document.createElement('img');
                img.src = char.portrait;
                img.className = 'character-illustration';
                slot.appendChild(img);
                void img.offsetWidth;
                img.classList.add('active');
                currentImg = img;
            }

            currentImg.classList.add('speaking');
            currentImg.classList.remove('fading');
            activePortraits[side] = char.name;
        }

        // [FIXED] renderDialogue: check for scene.choices at end
        function renderDialogue() {
            const scene = SCENES[state.scene];
            if (!scene || !scene.script) return;

            // Check for scene end
            if (state.index >= scene.script.length) {
                if (scene.choices) {
                    renderChoices(scene.choices);
                    return;
                }
                
                if (scene.next) {
                    loadScene(scene.next);
                } else {
                    const endMap = {
                        'scene_wakeup_GOOD': { type: 'TRUE END', title: '燈火闌珊處' },
                        'scene_wakeup_GOOD#1': { type: 'GOOD END', title: '我即那人' },
                        'scene_wakeup_BAD#1': { type: 'BAD END', title: '黃粱一夢' },
                        'scene_wakeup_BAD#3-1': { type: 'BAD END', title: '暖風熏得遊人醉' },
                        'scene_wakeup_BAD#3-2': { type: 'BAD END', title: '醉生夢死' }
                    };
                    if (endMap[state.scene]) {
                         showEnding(endMap[state.scene]);
                    }
                }
                return;
            }

            const line = scene.script[state.index];
            const nameBox = document.getElementById('character-name-box'); 
            const nameEl = document.getElementById('character-name'); 
            const tagEl = nameBox.querySelector('.char-tag');
            const textEl = document.getElementById('dialogue-text');

            if (line.char && line.char.name) {
                nameEl.textContent = line.char.name;
                tagEl.textContent = line.char.tag ? `（${line.char.tag}）` : '';
                nameBox.style.visibility = 'visible';
                nameBox.style.borderColor = line.char.color || '#ffb300';
            } else {
                nameBox.style.visibility = 'hidden';
            }
            
            if (line.char) {
                updateCharacterPortraitWithFade(line.char, state.index);
            }

            if (line.choices) {
                 renderChoices(line.choices);
                 return; 
            }
            
            textEl.innerHTML = '';
            state.isTyping = true;
            document.getElementById('next-indicator').style.display = 'none';
            typeText(line.text, 0);
        }

        function typeText(text, charIndex) {
            if (!state.isTyping) {
                document.getElementById('dialogue-text').innerHTML = text;
                finishType();
                return;
            }

            if (charIndex < text.length) {
                document.getElementById('dialogue-text').innerHTML += text.charAt(charIndex);
                setTimeout(() => typeText(text, charIndex + 1), 30);
            } else {
                finishType();
            }
        }

        // [UX CHANGE] loadScene: Minigames don't stop Auto
        function loadScene(sceneId) {
            try {
                if (sceneId === 'title') {
                    document.getElementById('title-screen').style.display = 'flex';
                    
                    document.getElementById('dialogue-layer').style.display = 'none';
                    document.getElementById('choices-container').style.display = 'none';
                    document.getElementById('minigame-overlay').style.display = 'none';
                    document.getElementById('history-overlay').style.display = 'none';
                    const endOverlay = document.getElementById('ending-overlay');
                    if (endOverlay) endOverlay.remove();

                    historyLog = []; 
                    state.weights = { awakening: 0, favor: 0 };
                    
                    if (state.isAuto) toggleAuto(); 
                    
                    resetCharacterTracking();
                    clearPortraits();
                    return;
                }

                state.scene = sceneId;
                state.index = 0;
                state.isTyping = false;

                const scene = SCENES[sceneId];
                if (!scene) {
                    console.error('場景不存在:', sceneId);
                    return;
                }
                
                analyzeSceneForLastAppearances(sceneId);

                if (scene.gameType === 'discover') {
                    if (autoTimer) clearTimeout(autoTimer);
                    document.getElementById('dialogue-layer').style.display = 'none';
                    document.getElementById('choices-container').style.display = 'none';
                    if (scene.config.bgImage) changeBg(scene.config.bgImage);
                    
                    // 使用新的 runDiscoverGame
                    runDiscoverGame(scene.config);
                    return;
                }

                if (scene.gameType === 'temptation') {
                    if (autoTimer) clearTimeout(autoTimer);
                    document.getElementById('dialogue-layer').style.display = 'none';
                    
                    // 使用改寫後的 runTemptationGame (基於 runMinigame)
                    runTemptationGame(scene.config);
                    return;
                }

                if (scene.bg) {
                    changeBg(scene.bg);
                }
                renderDialogue();

            } catch (error) {
                console.error('加載場景時發生錯誤:', error, 'sceneId:', sceneId);
            }
        }

        function changeBg(url) {
            const prev = document.getElementById(`scene-bg-${state.bgSlot}`);
            state.bgSlot = state.bgSlot === 1 ? 2 : 1;
            const next = document.getElementById(`scene-bg-${state.bgSlot}`);
            
            const img = new Image();
            img.onload = () => {
                next.style.backgroundImage = `url('${url}')`;
                next.classList.add('active');
                prev.classList.remove('active');
            };
            img.src = url;
        }

        // ==================== 改寫後的 Minigame 1: 拒絕誘惑 (原 runMinigame) ====================
        // 注意：這裡改名為 runTemptationGame 以適配 SCENES 中的調用
        function runTemptationGame(config) {
            const overlay = document.getElementById('minigame-overlay');
            overlay.innerHTML = '';
            overlay.style.display = 'flex';

            hideAllPortraits();
            
            // 使用您提供的 UI 結構
            overlay.innerHTML = `
                <div style="position: absolute; top: 20px; width: 100%; text-align: center; z-index: 30; pointer-events: none;">
                    <h2 style="font-size: 1.5rem; color: #ffca28; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">【心志試煉】眾裡尋他</h2>

            `;

            let progress = 0;
            let timeLeft = 60;
            let active = true;
            const area = document.getElementById('temptation-area');
            const status = document.getElementById('game-status');
            const timerEl = document.getElementById('game-timer');

            const correctWords = ["清醒", "故土", "北伐", "忠義", "山河", "風骨", "堅守", "本心", "責任", "理想"];
            const wrongWords = ["富貴", "享樂", "黃金", "美酒", "功名", "寶馬", "花燈", "沉淪", "忘卻", "溫柔鄉", "安逸", "妥協", "逃避"];

            // 計時器
            const timerInterval = setInterval(() => {
                if (!active) return;
                timeLeft--;
                timerEl.textContent = `時間: ${timeLeft}秒`;
                
                if (timeLeft <= 10) {
                    timerEl.style.color = "#ff5252";
                    timerEl.style.animation = "pulse 0.5s infinite";
                }
                
                if (timeLeft <= 0) {
                    endGame(false, "時間到！");
                }
            }, 1000);

            function spawnWord() {
                if (!active) return;
                
                const isTarget = Math.random() > 0.7; // 30% 機率是目標
                const word = isTarget ? 
                    correctWords[Math.floor(Math.random() * correctWords.length)] : 
                    wrongWords[Math.floor(Math.random() * wrongWords.length)];

                const el = document.createElement('div');
                el.textContent = word;
                el.className = 'distraction-item';
                
                // 基礎樣式設定
                el.style.cssText = `
                    position: absolute;
                    white-space: nowrap;
                    font-size: ${1.5 + Math.random() * 0.5}rem;

                    backdrop-filter: blur(2px);

                    el.style.boxShadow = '0 0 10px rgba(244, 67, 54, 0.3)';
                    el.style.fontWeight = 'bold';
                    
                    el.onclick = (e) => {
                        if (!active) return;
                        e.stopPropagation();
                        
                        // 錯誤懲罰
                        if (progress > 0) progress--;
                        status.textContent = `進度: ${progress}/5`;
                        status.style.color = "#f44336";
                        
                        // 錯誤效果
                        el.style.transform = 'scale(1.1)';
                        el.style.borderColor = '#ff5252';
                        el.style.boxShadow = '0 0 20px #ff5252';
                        el.style.backgroundColor = 'rgba(244, 67, 54, 0.4)';
                        
                        showFeedback("✗ 心志動搖！", "#f44336");
                        
                        // 遊戲區域震動效果
                        area.style.transform = 'translateX(5px)';
                        setTimeout(() => area.style.transform = 'translateX(-5px)', 50);
                        setTimeout(() => area.style.transform = 'translateX(0)', 100);
                        
                        // 紅色閃光效果
                        area.style.backgroundColor = 'rgba(244, 67, 54, 0.1)';
                        setTimeout(() => area.style.backgroundColor = 'rgba(20, 20, 30, 0.7)', 200);
                        
                        setTimeout(() => el.remove(), 500);
                    };
                }

                area.appendChild(el);

                // 計算隨機起始位置（從邊緣進入）
                const w = area.clientWidth;
                const h = area.clientHeight;
                const buffer = 50;

                let startX, startY, endX, endY;
                const edge = Math.floor(Math.random() * 4);

                switch(edge) {
                    case 0: // 上邊進入
                        startX = Math.random() * (w - 100) + 50; startY = -buffer;
                        endX = Math.random() * (w - 100) + 50; endY = h + buffer;
                        break;
                    case 1: // 右邊進入
                        startX = w + buffer; startY = Math.random() * (h - 100) + 50;
                        endX = -buffer; endY = Math.random() * (h - 100) + 50;
                        break;
                    case 2: // 下邊進入
                        startX = Math.random() * (w - 100) + 50; startY = h + buffer;
                        endX = Math.random() * (w - 100) + 50; endY = -buffer;
                        break;
                    case 3: // 左邊進入
                        startX = -buffer; startY = Math.random() * (h - 100) + 50;
                        endX = w + buffer; endY = Math.random() * (h - 100) + 50;
                        break;
                }

                el.style.left = `${startX}px`;
                el.style.top = `${startY}px`;

                // 動畫
                const rotateStart = (Math.random() - 0.5) * 60;
                const rotateEnd = rotateStart + (Math.random() - 0.5) * 180;
                const duration = 6000 + Math.random() * 4000;

                const animation = el.animate([
                    { 
                        transform: `translate(0, 0) rotate(${rotateStart}deg)`,
                        opacity: 0.8 
                    },
                    { 
                        transform: `translate(${endX - startX}px, ${endY - startY}px) rotate(${rotateEnd}deg)`,
                        opacity: 0.8 
                    }
                ], {
                    duration: duration,
                    easing: 'linear',
                    fill: 'forwards'
                });

                animation.onfinish = () => {
                    if (el.parentNode) el.remove();
                };

                if (active) {
                    const nextSpawnTime = 1000 - (progress * 100);
                    setTimeout(spawnWord, Math.max(400, nextSpawnTime));
                }
            }

        // ==================== 改寫後的 Minigame 2: 尋找隱藏物品 (原 runDiscoverGame) ====================
        function runDiscoverGame(config) {
            const overlay = document.getElementById('minigame-overlay');
            overlay.innerHTML = '';
            overlay.style.display = 'flex';
            overlay.style.background = 'rgba(0,0,0,1)';

            const targetHint = config.targetHint || "可疑之處";
            const goalCount = config.limit;
            const timeLimit = config.timeLimit || 30;
            
            let correctCount = 0;
            let timeLeft = timeLimit;
            let isGameActive = true;
            let timerInterval = null;

            // 1. Container
            const container = document.createElement('div');
            container.style.cssText = `
                position: relative;
                width: 100%;
                height: 100%;
                background-image: url('${config.bgImage}');
                background-size: cover;
                background-position: center;
                overflow: hidden;
            `;

            // 2. HUD
            const hud = document.createElement('div');
            hud.style.cssText = `
                position: absolute;
                top: 0; left: 0; width: 100%;
                padding: 20px;
                display: flex;
                justify-content: space-between;
                background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
                pointer-events: none;
                z-index: 10;
            `;
            
            // Task Info
            const taskBox = document.createElement('div');
            taskBox.innerHTML = `
                <div style="color:#aaa; font-size:0.9rem;">尋找</div>
                <div style="color:#ffb300; font-size:1.4rem; font-weight:bold;">${targetHint}</div>
            `;
            
            // Status Info
            const statusBox = document.createElement('div');
            statusBox.style.textAlign = 'right';
            const updateStatus = () => {
                statusBox.innerHTML = `
                    <div style="color:#fff; font-size:1.2rem;">倒數: ${timeLeft}s</div>
                    <div style="color:#ccc;">進度: ${correctCount}/${goalCount}</div>
                `;
            };
            updateStatus();

            hud.appendChild(taskBox);
            hud.appendChild(statusBox);
            container.appendChild(hud);

            // 3. Targets
            config.targets.forEach((pos) => {
                const block = document.createElement('div');
                block.style.cssText = `
                    position: absolute;
                    top: ${pos.top};
                    left: ${pos.left};
                    width: ${pos.width};
                    height: ${pos.height};
                    cursor: pointer;
                    z-index: 5;
                `;
                
                let isFound = false;
                block.onclick = (e) => {
                    e.stopPropagation();
                    if (!isGameActive || isFound) return;
                    
                    isFound = true;
                    correctCount++;
                    updateStatus();

                    // Visual Feedback
                    const circle = document.createElement('div');
                    circle.style.cssText = `
                        position: absolute;
                        inset: 0;
                        border: 3px solid #ffb300;
                        border-radius: 50%;
                        box-shadow: 0 0 15px #ffb300;
                        animation: discoverZoom 0.5s ease-out;
                    `;
                    block.appendChild(circle);
                    
                    // 判斷勝利
                    if (correctCount >= goalCount) {
                         // 這裡可以選擇立即勝利，或者等待時間結束
                         // 根據您的代碼邏輯，似乎是等待時間結束或繼續點擊直到全部找到
                         // 這裡簡單處理：如果全部找到（targets.length），就直接勝利
                         if (config.targets && correctCount >= config.targets.length) {
                             endGame(true);
                         }
                    }
                };

                container.appendChild(block);
            });

            // 4. Timer Logic
            timerInterval = setInterval(() => {
                if (!isGameActive) return;
                timeLeft--;
                updateStatus();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    isGameActive = false;
                    
                    // --- 結算邏輯 ---
                    if (correctCount >= goalCount) {
                        const totalTargets = config.targets ? config.targets.length : 4;
                        
                        // [NEW] 觸發隱藏劇情的權重邏輯
                        if (correctCount >= totalTargets) {
                            if (!state.weights) state.weights = { awakening: 0, favor: 0 };
                            
                            state.weights.awakening = (state.weights.awakening || 0) + 10;
                            state.weights.favor = (state.weights.favor || 0) + 10;
                            
                            console.log("觸發隱藏劇情！權重已更新:", state.weights);
                        }

                        endGame(true);
                    } else {
                        endGame(false);
                    }
                }
            }, 1000);

            function endGame(win) {
                isGameActive = false;
                clearInterval(timerInterval);
                
                setTimeout(() => {
                    const resultBox = document.createElement('div');
                    resultBox.style.cssText = `
                        position: absolute; inset: 0;
                        background: rgba(0,0,0,0.9);
                        display: flex; flex-direction: column;
                        justify-content: center; align-items: center;
                        z-index: 20; animation: fadeIn 0.5s;
                    `;
                    
                    const title = win ? "成功尋獲！" : "失敗";
                    const color = win ? "#ffb300" : "#ff5252";
                    const sub = "點擊繼續";
                    
                    resultBox.innerHTML = `
                        <h2 style="color:${color}; font-size:2.5rem; margin-bottom:10px;">${title}</h2>
                        <div style="color:#fff;">${sub}</div>
                    `;
                    
                    resultBox.onclick = () => {
                        overlay.style.display = 'none';
                        // 恢復 UI
                        document.getElementById('dialogue-layer').style.display = 'flex';
                        if (win) {
                            loadScene(config.nextPass);
                        } else {
                            loadScene(config.nextFail);
                        }
                    };
                    
                    container.appendChild(resultBox);
                }, 500);
            }

            overlay.appendChild(container);
        }
